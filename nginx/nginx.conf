# Template di un virtual host, incluso nel contesto http da Nginx.
server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name ${PROJECT1_DOMAIN} localhost;
    root /var/www/progetto1;
    index index.html;
    client_max_body_size 10m;

    location = /api { return 308 /api/; }
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend-progetto1:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name ${REGISTRO_DOMAIN};
    root /var/www/registrosport;
    index index.html;
    client_max_body_size 10m;

    location = /api/auth {
        internal;
        proxy_pass http://backend-registrosport:8000/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }
    location = /api { return 308 /api/; }
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend backend-registrosport:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    location / {
        auth_request /api/auth;
        auth_request_set $auth_header $upstream_http_www_authenticate;
        add_header WWW-Authenticate $auth_header always;
        try_files $uri $uri/ /index.html;
    }
}
